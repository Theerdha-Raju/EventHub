<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - EventHub</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>

<!-- Navbar -->
<header class="navbar">
    <div class="container">
        <div class="nav-wrapper">
            <a href="../../frontend/index.html" class="brand-logo">
                <span class="brand-icon">🎟️</span>
                <span>EventHub</span>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="../../frontend/index.html" class="nav-link">📅 Events</a></li>
                    <li><a href="../../frontend/register.html" class="nav-link">✍️ Register</a></li>
                </ul>
            </nav>
        </div>
    </div>
</header>

<main class="main-content">
    <div style="max-width: 440px; margin: 40px auto 60px; padding: 0 20px;">
        <div class="card">

            <!-- Lock Icon + Title -->
            <div style="text-align: center; margin-bottom: 28px;">
                <div style="width:56px; height:56px; background:var(--primary-light); color:var(--primary); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:26px; margin:0 auto 14px;">
                    🔒
                </div>
                <h1 style="font-size:22px; font-weight:800; color:var(--secondary); margin-bottom:6px;">
                    Admin Portal Login
                </h1>
                <p style="color:var(--text-muted); font-size:13.5px; margin:0;">
                    Sign in to manage events and review registrations.
                </p>
            </div>

            <!-- Error Alert -->
            <div id="loginError" class="alert alert-danger" style="display:none;">
                <span>⚠️</span>
                <div id="loginErrorMsg">Invalid username or password.</div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>

                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Enter admin username"
                        required
                        autofocus
                        autocomplete="username"
                    >
                    <div class="form-feedback" id="user_fb"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter admin password"
                        required
                        autocomplete="current-password"
                    >
                    <div class="form-feedback" id="pass_fb"></div>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; padding:12px; margin-top:10px;">
                    Sign In to Dashboard &rarr;
                </button>
            </form>

            <div style="text-align:center; margin-top:20px; font-size:13.5px;">
                <a href="../../frontend/index.html" style="color:var(--text-muted);">
                    &larr; Return to Public Site
                </a>
            </div>
        </div>
    </div>
</main>

<!-- Footer -->
<footer style="background:var(--secondary); color:#94a3b8; text-align:center; padding:24px 20px; margin-top:auto; font-size:13.5px;">
    <p>🎟️ <strong style="color:#fff;">EventHub</strong> &mdash; Event Registration &amp; Management System</p>
    <p style="margin-top:6px;">Frontend: HTML &bull; CSS &bull; JavaScript &nbsp;|&nbsp; Backend: PHP &bull; MySQL</p>
</footer>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value;
        const errDiv = document.getElementById('loginError');
        const userFb = document.getElementById('user_fb');
        const passFb = document.getElementById('pass_fb');

        // Reset
        errDiv.style.display = 'none';
        userFb.textContent = '';
        passFb.textContent = '';

        if (!user) { userFb.textContent = 'Username is required.'; userFb.style.color='var(--danger)'; return; }
        if (!pass)  { passFb.textContent = 'Password is required.';  passFb.style.color='var(--danger)'; return; }

        // Frontend demo: check hardcoded credentials
        // In real app, this POST goes to admin/login.php (PHP backend)
        if (user === 'admin' && pass === 'admin123') {
            sessionStorage.setItem('admin_logged_in', 'true');
            sessionStorage.setItem('admin_name', 'Administrator');
            window.location.href = 'dashboard.html';
        } else {
            errDiv.style.display = 'flex';
            document.getElementById('loginErrorMsg').textContent = 'Invalid username or password. Please try again.';
        }
    });
</script>
</body>
</html>
